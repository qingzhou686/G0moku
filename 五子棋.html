<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>五子棋 · Gomoku</title>
<meta name="description" content="在线五子棋：人机对战与双人对战，支持悔棋、落子记录与胜负高亮。" />
<meta name="theme-color" content="#14161c" />
<meta property="og:type" content="website" />
<meta property="og:title" content="五子棋 · 在线对弈" />
<meta property="og:description" content="15×15 棋盘，人机对战（三档难度）与双人对战，含悔棋、落子记录与五连高亮。" />

<style>
:root {
  --bg: #14161c;
  --bg-soft: #1b1e26;
  --card: rgba(255, 255, 255, 0.045);
  --card-border: rgba(255, 255, 255, 0.09);
  --text: #eceff5;
  --text-dim: #98a0b3;
  --accent: #e0a34a;
  --accent-soft: rgba(224, 163, 74, 0.16);
  --line: #6b4f2a;
  --wood-1: #f0cf95;
  --wood-2: #dfb06c;
  --wood-3: #c9914b;
  --radius: 16px;
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(1100px 640px at 12% -10%, rgba(224, 163, 74, 0.14), transparent 62%),
    radial-gradient(900px 560px at 100% 8%, rgba(96, 132, 255, 0.10), transparent 58%),
    var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 22px 20px 40px;
}

.app {
  max-width: 1180px;
  margin: 0 auto;
}

/* ---------- 顶部 ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background:
    radial-gradient(circle at 30% 30%, #ffffff 0 14%, transparent 15%),
    linear-gradient(155deg, #f3d59d, #cf9648);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16), 0 8px 20px rgba(0, 0, 0, 0.34);
  position: relative;
}

.brand-mark::after {
  content: "";
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: radial-gradient(circle at 33% 30%, #6b6f7a, #16181d 70%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
}

h1 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 0.06em;
  font-weight: 650;
}

.brand-sub {
  margin: 3px 0 0;
  font-size: 12.5px;
  color: var(--text-dim);
  letter-spacing: 0.02em;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid var(--card-border);
  background: var(--card);
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: color .18s, border-color .18s, background .18s;
}

.icon-btn:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.2); }
.icon-btn[aria-pressed="true"] { color: var(--accent); border-color: rgba(224, 163, 74, 0.4); background: var(--accent-soft); }
.icon-btn[aria-pressed="true"] .icon-sound-off,
.icon-btn[aria-pressed="false"] .icon-sound-on { display: none; }

/* ---------- 布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 22px;
  align-items: start;
}

.board-frame {
  position: relative;
  border-radius: 20px;
  padding: 14px;
  background: linear-gradient(150deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
  box-shadow: var(--shadow);
}

#board {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: inset 0 0 0 1px rgba(90, 58, 18, 0.5);
}

#board.locked { cursor: default; }

/* ---------- 侧栏 ---------- */
.side-panel {
  display: grid;
  gap: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 16px;
  backdrop-filter: blur(8px);
}

.card-title {
  margin: 0 0 12px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 600;
}

.status-card { padding: 18px 16px; }

.turn-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.turn-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  flex: none;
  transition: background .2s;
}

.turn-dot.black { background: radial-gradient(circle at 33% 30%, #6d7280, #15171c 72%); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5); }
.turn-dot.white { background: radial-gradient(circle at 33% 30%, #ffffff, #d8d2c6 78%); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35); }
.turn-dot.win { box-shadow: 0 0 0 4px var(--accent-soft), 0 0 16px rgba(224, 163, 74, 0.55); }

.status-text {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.status-sub {
  margin: 3px 0 0;
  font-size: 12.5px;
  color: var(--text-dim);
}

.score-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--card-border);
}

.score-item {
  display: grid;
  gap: 4px;
  justify-items: center;
}

.score-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--text-dim);
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.dot.black { background: #1d2027; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28); }
.dot.white { background: #f4f1ea; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2); }

.score-value {
  font-size: 19px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 5px;
  background: rgba(0, 0, 0, 0.28);
  border-radius: 12px;
}

.seg {
  padding: 9px 8px;
  border: none;
  border-radius: 9px;
  background: transparent;
  color: var(--text-dim);
  font-size: 13.5px;
  font-family: inherit;
  cursor: pointer;
  transition: background .18s, color .18s;
}

.seg:hover { color: var(--text); }
.seg.active {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06));
  color: var(--text);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset, 0 4px 12px rgba(0, 0, 0, 0.3);
}

.ai-options {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-dim);
}

.ai-options.hidden { display: none; }

.select {
  width: 100%;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid var(--card-border);
  background: rgba(0, 0, 0, 0.35);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}

.select:focus-visible,
.btn:focus-visible,
.seg:focus-visible,
.icon-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.btn {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 550;
  cursor: pointer;
  transition: transform .12s, filter .18s, background .18s, border-color .18s;
}

.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(180deg, #f0b862, #d1913b);
  color: #241703;
}

.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

.btn-ghost {
  background: rgba(255, 255, 255, 0.05);
  border-color: var(--card-border);
  color: var(--text);
}

.btn-ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }

.switch {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
}

.switch input {
  appearance: none;
  width: 38px;
  height: 21px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  position: relative;
  cursor: pointer;
  transition: background .2s;
}

.switch input::after {
  content: "";
  position: absolute;
  top: 2.5px;
  left: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s;
}

.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); }

.history-card { min-height: 120px; }

.history {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 210px;
  overflow-y: auto;
  display: grid;
  gap: 2px;
  font-size: 13px;
}

.history li {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 8px;
  border-radius: 8px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.history li:nth-child(odd) { background: rgba(255, 255, 255, 0.035); }
.history li.latest { color: var(--text); background: var(--accent-soft); }
.history li .no { width: 26px; color: #6d7484; }
.history .empty { color: #5c6272; font-size: 12.5px; }

/* ---------- 棋盘上的浮层 ---------- */
.thinking {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(12, 13, 17, 0.82);
  border: 1px solid var(--card-border);
  color: #dbe0ea;
  font-size: 12.5px;
  pointer-events: none;
}

.thinking[hidden] { display: none; }

.spinner {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.25);
  border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.overlay {
  position: absolute;
  inset: 14px;
  border-radius: 12px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 22px;
  background: linear-gradient(to top,
    rgba(10, 11, 15, 0.62) 0%,
    rgba(10, 11, 15, 0.28) 42%,
    rgba(10, 11, 15, 0.1) 100%);
  animation: fade .22s ease-out;
}

.overlay[hidden] { display: none; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.overlay-card {
  text-align: center;
  padding: 18px 24px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(36, 39, 48, 0.96), rgba(22, 24, 30, 0.96));
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 16px 34px rgba(0, 0, 0, 0.48);
  animation: pop .24s cubic-bezier(.2, .9, .3, 1.2);
}

@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.overlay-title {
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: 0.04em;
}

.overlay-text {
  margin: 6px 0 14px;
  font-size: 12.5px;
  color: var(--text-dim);
}

.overlay-actions {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.footer {
  margin-top: 22px;
  text-align: center;
  color: #6f7687;
  font-size: 12.5px;
}

kbd {
  padding: 1px 6px;
  border-radius: 5px;
  border: 1px solid var(--card-border);
  background: rgba(255, 255, 255, 0.06);
  font-family: inherit;
  font-size: 11.5px;
}

/* ---------- 响应式 ---------- */
@media (max-width: 940px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side-panel { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .history-card { grid-column: 1 / -1; }
}

@media (max-width: 560px) {
  body { padding: 16px 12px 32px; }
  h1 { font-size: 19px; }
  .board-frame { padding: 9px; }
  .overlay { inset: 9px; }
  .overlay-card { padding: 20px; }
  .brand-sub { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>五子棋</h1>
        <p class="brand-sub">Gomoku · 15 × 15 · 连成五子者胜</p>
      </div>
    </div>
    <button id="soundBtn" class="icon-btn" type="button" aria-pressed="true" title="落子音效">
      <span class="icon-sound-on">🔊</span><span class="icon-sound-off">🔇</span>
      <span class="icon-btn-label">音效</span>
    </button>
  </header>

  <main class="layout">
    <section class="board-panel">
      <div class="board-frame">
        <canvas id="board" role="img" aria-label="五子棋棋盘"></canvas>
        <div id="thinking" class="thinking" hidden>
          <span class="spinner" aria-hidden="true"></span>思考中…
        </div>
        <div id="overlay" class="overlay" hidden>
          <div class="overlay-card">
            <p id="overlayTitle" class="overlay-title">黑棋胜</p>
            <p id="overlayText" class="overlay-text">共 0 手</p>
            <div class="overlay-actions">
              <button id="overlayAgain" class="btn btn-primary" type="button">再来一局</button>
              <button id="overlayClose" class="btn btn-ghost" type="button">看看棋盘</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="side-panel">
      <div class="card status-card">
        <div class="turn-row">
          <span id="turnDot" class="turn-dot black"></span>
          <div>
            <p id="statusText" class="status-text">黑棋先行</p>
            <p id="statusSub" class="status-sub">点击棋盘落子</p>
          </div>
        </div>
        <div class="score-row">
          <div class="score-item">
            <span class="score-label"><i class="dot black"></i>黑棋</span>
            <span id="scoreBlack" class="score-value">0</span>
          </div>
          <div class="score-item">
            <span class="score-label"><i class="dot white"></i>白棋</span>
            <span id="scoreWhite" class="score-value">0</span>
          </div>
          <div class="score-item">
            <span class="score-label">和棋</span>
            <span id="scoreDraw" class="score-value">0</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">对局模式</h2>
        <div class="segmented" role="group" aria-label="对局模式">
          <button class="seg active" data-mode="pve" type="button">人机对战</button>
          <button class="seg" data-mode="pvp" type="button">双人对战</button>
        </div>
        <div id="aiOptions" class="ai-options">
          <label for="sideSelect">我执</label>
          <select id="sideSelect" class="select">
            <option value="black">黑棋（先手）</option>
            <option value="white">白棋（后手）</option>
          </select>
          <label for="levelSelect">难度</label>
          <select id="levelSelect" class="select">
            <option value="easy">简单</option>
            <option value="normal" selected>普通</option>
            <option value="hard">困难</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">操作</h2>
        <div class="actions">
          <button id="undoBtn" class="btn btn-ghost" type="button">悔棋</button>
          <button id="restartBtn" class="btn btn-primary" type="button">重新开始</button>
        </div>
        <label class="switch">
          <input id="coordToggle" type="checkbox" checked />
          <span>显示坐标</span>
        </label>
      </div>

      <div class="card history-card">
        <h2 class="card-title">落子记录</h2>
        <ol id="history" class="history"></ol>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <p>快捷键：<kbd>U</kbd> 悔棋 · <kbd>R</kbd> 重开 · <kbd>空格</kbd> 音效开关</p>
  </footer>
</div>

<script>
/*
 * 五子棋核心逻辑（纯函数，不依赖 DOM）
 * 既可在浏览器中通过 window.GomokuCore 使用，也可在 Node 中 require 做测试。
 */
(function (global) {
  'use strict';

  var SIZE = 15;
  var EMPTY = 0;
  var BLACK = 1;
  var WHITE = 2;
  var DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];

  // 单点评分表（按形成棋形的强弱排序）
  var S = {
    FIVE: 10000000,
    OPEN_FOUR: 1000000,
    FOUR: 10000,      // 冲四：一端被堵
    OPEN_THREE: 8000, // 活三
    THREE: 1000,      // 眠三
    OPEN_TWO: 800,
    TWO: 100,
    ONE: 10
  };

  function createBoard(size) {
    var n = size || SIZE;
    return { size: n, cells: new Uint8Array(n * n) };
  }

  function idx(board, r, c) {
    return r * board.size + c;
  }

  function inBounds(board, r, c) {
    return r >= 0 && c >= 0 && r < board.size && c < board.size;
  }

  function get(board, r, c) {
    return inBounds(board, r, c) ? board.cells[idx(board, r, c)] : -1;
  }

  function set(board, r, c, v) {
    board.cells[idx(board, r, c)] = v;
  }

  function clone(board) {
    return { size: board.size, cells: board.cells.slice() };
  }

  function other(player) {
    return player === BLACK ? WHITE : BLACK;
  }

  /** 从 (r,c) 出发检查是否连成五子，返回取胜的坐标数组，否则 null。 */
  function findWin(board, r, c) {
    var player = get(board, r, c);
    if (player <= 0) return null;

    for (var d = 0; d < DIRS.length; d++) {
      var dr = DIRS[d][0];
      var dc = DIRS[d][1];
      var line = [[r, c]];

      for (var sign = -1; sign <= 1; sign += 2) {
        var i = 1;
        while (get(board, r + dr * i * sign, c + dc * i * sign) === player) {
          line.push([r + dr * i * sign, c + dc * i * sign]);
          i++;
        }
      }

      if (line.length >= 5) {
        line.sort(function (a, b) {
          return a[0] === b[0] ? a[1] - b[1] : a[0] - b[0];
        });
        return line;
      }
    }
    return null;
  }

  function isFull(board) {
    for (var i = 0; i < board.cells.length; i++) {
      if (board.cells[i] === EMPTY) return false;
    }
    return true;
  }

  /**
   * 在 (r,c) 落子后，该点对 player 的价值。
   * 统计四个方向上的连子数与两端封堵情况，按棋形查表累加。
   */
  function evaluatePoint(bd, r, c, player) {
    if (get(bd, r, c) !== EMPTY) return 0;
    var total = 0;

    for (var d = 0; d < DIRS.length; d++) {
      var dr = DIRS[d][0];
      var dc = DIRS[d][1];
      var count = 1;
      var openEnds = 0;
      var gapBonus = 0;

      for (var sign = -1; sign <= 1; sign += 2) {
        var step = 1;
        while (get(bd, r + dr * step * sign, c + dc * step * sign) === player) {
          count++;
          step++;
        }
        var nr = r + dr * step * sign;
        var nc = c + dc * step * sign;
        if (inBounds(bd, nr, nc) && get(bd, nr, nc) === EMPTY) {
          openEnds++;
          // 隔一格的己方棋子（跳三/跳四的雏形）给予少量加成
          var fr = nr + dr * sign;
          var fc = nc + dc * sign;
          if (get(bd, fr, fc) === player) gapBonus += 1;
        }
      }

      var score;
      if (count >= 5) score = S.FIVE;
      else if (count === 4) score = openEnds === 2 ? S.OPEN_FOUR : openEnds === 1 ? S.FOUR : 0;
      else if (count === 3) score = openEnds === 2 ? S.OPEN_THREE : openEnds === 1 ? S.THREE : 0;
      else if (count === 2) score = openEnds === 2 ? S.OPEN_TWO : openEnds === 1 ? S.TWO : 0;
      else score = openEnds === 2 ? S.ONE : openEnds > 0 ? 2 : 0;

      total += score + gapBonus * 12;
    }
    return total;
  }

  /** 生成候选点：已有棋子周围 2 格内的空点（空盘则取天元）。 */
  function candidateMoves(bd, radius) {
    var rad = radius || 2;
    var out = [];
    var hasStone = false;
    var center = Math.floor(bd.size / 2);

    for (var i = 0; i < bd.cells.length; i++) {
      if (bd.cells[i] !== EMPTY) { hasStone = true; break; }
    }
    if (!hasStone) return [[center, center]];

    for (var r = 0; r < bd.size; r++) {
      for (var c = 0; c < bd.size; c++) {
        if (get(bd, r, c) !== EMPTY) continue;
        var near = false;
        for (var rr = Math.max(0, r - rad); rr <= Math.min(bd.size - 1, r + rad) && !near; rr++) {
          for (var cc = Math.max(0, c - rad); cc <= Math.min(bd.size - 1, c + rad); cc++) {
            if (bd.cells[idx(bd, rr, cc)] !== EMPTY) { near = true; break; }
          }
        }
        if (near) out.push([r, c]);
      }
    }
    return out;
  }

  function countNeighbors(bd, r, c, radius) {
    var rad = radius || 2;
    var n = 0;
    for (var rr = Math.max(0, r - rad); rr <= Math.min(bd.size - 1, r + rad); rr++) {
      for (var cc = Math.max(0, c - rad); cc <= Math.min(bd.size - 1, c + rad); cc++) {
        if (bd.cells[idx(bd, rr, cc)] !== EMPTY) n++;
      }
    }
    return n;
  }

  /**
   * 为某一方排出候选点及其攻防价值。
   * attack：我方在此落子的价值；defend：对方在此落子的价值（即我堵住对方的价值）。
   */
  function scoreMoves(bd, player, limit) {
    var opp = other(player);
    var cands = candidateMoves(bd);
    var list = [];

    for (var k = 0; k < cands.length; k++) {
      var r = cands[k][0];
      var c = cands[k][1];
      var attack = evaluatePoint(bd, r, c, player);
      var defend = evaluatePoint(bd, r, c, opp);
      var value = attack * 1.12 + defend + countNeighbors(bd, r, c) * 2;
      list.push({ r: r, c: c, attack: attack, defend: defend, value: value });
    }

    list.sort(function (a, b) { return b.value - a.value; });
    return limit ? list.slice(0, limit) : list;
  }

  /** 找到能立刻五连的点。 */
  function findImmediateWin(bd, player, cands) {
    var list = cands || candidateMoves(bd);
    for (var i = 0; i < list.length; i++) {
      var r = list[i][0];
      var c = list[i][1];
      set(bd, r, c, player);
      var win = findWin(bd, r, c);
      set(bd, r, c, EMPTY);
      if (win) return { r: r, c: c };
    }
    return null;
  }

  /** 站在当前局面，某一方下一步能直接连五的点有几个（≥2 即无法被单点封堵）。 */
  function countWinningPoints(bd, player) {
    var cands = candidateMoves(bd);
    var count = 0;
    for (var i = 0; i < cands.length; i++) {
      var r = cands[i][0];
      var c = cands[i][1];
      set(bd, r, c, player);
      var win = findWin(bd, r, c);
      set(bd, r, c, EMPTY);
      if (win) count++;
    }
    return count;
  }

  /**
   * 判断 player 是否能在两步内制造出「双成五点」（对手封不住）。
   * 先用棋形分粗筛，避免对每个空点都做完整推演。
   */
  function canMakeDoubleThreat(bd, player) {
    var cands = candidateMoves(bd);
    for (var i = 0; i < cands.length; i++) {
      var r = cands[i][0];
      var c = cands[i][1];
      // 只有至少能形成活三/冲四的点，才可能一步造就双杀
      if (evaluatePoint(bd, r, c, player) < S.OPEN_THREE) continue;
      set(bd, r, c, player);
      var win = findWin(bd, r, c);
      var doubleThreat = !win && countWinningPoints(bd, player) >= 2;
      set(bd, r, c, EMPTY);
      if (win || doubleThreat) return true;
    }
    return false;
  }

  function pick(list) {
    return { r: list[0].r, c: list[0].c };
  }

  /**
   * 选择 AI 落子点。
   * difficulty: 'easy' | 'normal' | 'hard'
   */
  function chooseMove(bd, player, difficulty) {
    var level = difficulty || 'normal';
    var opp = other(player);
    var work = clone(bd);
    var all = candidateMoves(work);
    var i;

    // 1. 自己能赢就赢
    var win = findImmediateWin(work, player, all);
    if (win) return win;

    // 2. 对方能赢就堵（简单难度会漏看，保留可玩性）
    var threat = findImmediateWin(work, opp, all);
    if (threat) {
      if (level === 'hard' || level === 'normal') return threat;
      if (Math.random() < 0.5) return threat;
    }

    var scored = scoreMoves(work, player);
    if (!scored.length) {
      var center = Math.floor(work.size / 2);
      return { r: center, c: center };
    }

    // 简单：带噪声地在偏好点里挑，偶尔完全随机，因此人类容易取胜
    if (level === 'easy') {
      if (Math.random() < 0.3) {
        var loose = candidateMoves(work);
        var rp = loose[Math.floor(Math.random() * loose.length)];
        return { r: rp[0], c: rp[1] };
      }
      var noisy = scored.map(function (item) {
        return { r: item.r, c: item.c, value: item.value * (0.4 + Math.random()) };
      }).sort(function (a, b) { return b.value - a.value; });
      var poolSize = Math.min(noisy.length, Math.max(2, Math.min(6, Math.ceil(noisy.length * 0.35))));
      var chosen = noisy[Math.floor(Math.random() * poolSize)];
      return { r: chosen.r, c: chosen.c };
    }

    if (level === 'normal') return pick(scored);

    // hard：在贪心评分的基础上增加两层判断
    //   a. 杀招：某一手能让我下一手出现两个成五点，对手无法同时封堵
    //   b. 避免走进对手两步杀的局面
    var top = scored.slice(0, 10);
    for (i = 0; i < top.length; i++) {
      var mv = top[i];
      set(work, mv.r, mv.c, player);
      var myWin = findWin(work, mv.r, mv.c);
      if (myWin) { set(work, mv.r, mv.c, EMPTY); return { r: mv.r, c: mv.c }; }

      var kill = !findImmediateWin(work, opp) && countWinningPoints(work, player) >= 2;
      set(work, mv.r, mv.c, EMPTY);
      if (kill) return { r: mv.r, c: mv.c };
    }

    var safe = top.filter(function (cand) {
      set(work, cand.r, cand.c, player);
      var losing = !!findImmediateWin(work, opp) || canMakeDoubleThreat(work, opp);
      set(work, cand.r, cand.c, EMPTY);
      return !losing;
    });
    return pick(safe.length ? safe : scored);
  }

  /** 棋盘坐标 → 人类可读记号，例如 (7,7) → H8 */
  function toNotation(r, c) {
    return String.fromCharCode(65 + c) + (r + 1);
  }

  var API = {
    SIZE: SIZE,
    EMPTY: EMPTY,
    BLACK: BLACK,
    WHITE: WHITE,
    SCORES: S,
    createBoard: createBoard,
    clone: clone,
    get: get,
    set: set,
    other: other,
    findWin: findWin,
    isFull: isFull,
    evaluatePoint: evaluatePoint,
    candidateMoves: candidateMoves,
    findImmediateWin: findImmediateWin,
    countWinningPoints: countWinningPoints,
    canMakeDoubleThreat: canMakeDoubleThreat,
    scoreMoves: scoreMoves,
    chooseMove: chooseMove,
    toNotation: toNotation
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else global.GomokuCore = API;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 五子棋界面：Canvas 绘制 + 交互 + 人机对战调度 */
(function () {
  'use strict';

  var Core = window.GomokuCore;
  var SIZE = Core.SIZE;
  var EMPTY = Core.EMPTY;
  var BLACK = Core.BLACK;
  var WHITE = Core.WHITE;
  var STAR_POINTS = [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]];

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var bgCanvas = document.createElement('canvas');
  var bgCtx = bgCanvas.getContext('2d');

  var el = {
    turnDot: document.getElementById('turnDot'),
    statusText: document.getElementById('statusText'),
    statusSub: document.getElementById('statusSub'),
    scoreBlack: document.getElementById('scoreBlack'),
    scoreWhite: document.getElementById('scoreWhite'),
    scoreDraw: document.getElementById('scoreDraw'),
    history: document.getElementById('history'),
    thinking: document.getElementById('thinking'),
    overlay: document.getElementById('overlay'),
    overlayTitle: document.getElementById('overlayTitle'),
    overlayText: document.getElementById('overlayText'),
    overlayAgain: document.getElementById('overlayAgain'),
    overlayClose: document.getElementById('overlayClose'),
    undoBtn: document.getElementById('undoBtn'),
    restartBtn: document.getElementById('restartBtn'),
    aiOptions: document.getElementById('aiOptions'),
    sideSelect: document.getElementById('sideSelect'),
    levelSelect: document.getElementById('levelSelect'),
    coordToggle: document.getElementById('coordToggle'),
    soundBtn: document.getElementById('soundBtn')
  };

  var state = {
    board: Core.createBoard(),
    current: BLACK,
    history: [],
    over: false,
    winningLine: null,
    winner: null,
    mode: 'pve',
    humanColor: BLACK,
    level: 'normal',
    showCoords: true,
    soundOn: true,
    thinking: false,
    hover: null,
    scores: { black: 0, white: 0, draw: 0 }
  };

  var geometry = { size: 0, inset: 0, cell: 0, dpr: 1 };

  /* ---------------- 尺寸与静态背景 ---------------- */

  function computeGeometry() {
    var rect = canvas.getBoundingClientRect();
    var cssSize = Math.max(240, rect.width || canvas.clientWidth || 600);
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var inset = cssSize * (state.showCoords ? 0.058 : 0.032);
    var cell = (cssSize - inset * 2) / (SIZE - 1);

    geometry.size = cssSize;
    geometry.inset = inset;
    geometry.cell = cell;
    geometry.dpr = dpr;

    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    canvas.style.height = cssSize + 'px';
    bgCanvas.width = canvas.width;
    bgCanvas.height = canvas.height;

    buildBackground();
  }

  function pos(i) {
    return geometry.inset + i * geometry.cell;
  }

  function clientToCell(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) return null;
    var scale = geometry.size / rect.width;
    var x = (clientX - rect.left) * scale;
    var y = (clientY - rect.top) * scale;
    var c = Math.round((x - geometry.inset) / geometry.cell);
    var r = Math.round((y - geometry.inset) / geometry.cell);
    if (r < 0 || c < 0 || r >= SIZE || c >= SIZE) return null;
    var dx = x - pos(c);
    var dy = y - pos(r);
    if (Math.sqrt(dx * dx + dy * dy) > geometry.cell * 0.62) return null;
    return { r: r, c: c };
  }

  // 背景只在与尺寸相关时重建：木纹 + 网格 + 星位 + 坐标
  function buildBackground() {
    var size = geometry.size;
    var inset = geometry.inset;
    var cell = geometry.cell;
    var dpr = geometry.dpr;
    var c = bgCtx;

    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, size, size);

    var wood = c.createLinearGradient(0, 0, size, size);
    wood.addColorStop(0, '#f1d29c');
    wood.addColorStop(0.45, '#e3b877');
    wood.addColorStop(1, '#cd9750');
    c.fillStyle = wood;
    c.fillRect(0, 0, size, size);

    // 木纹：几条半透明曲线，用固定种子的噪声保证每次重绘一致
    var seed = 20240501;
    function rnd() {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed / 0x7fffffff;
    }
    c.save();
      c.globalAlpha = 0.04;
    for (var g = 0; g < 46; g++) {
      var y0 = rnd() * size;
      var amp = 4 + rnd() * 16;
      c.beginPath();
      c.moveTo(0, y0);
      for (var x = 0; x <= size; x += size / 8) {
        c.lineTo(x, y0 + Math.sin((x / size) * Math.PI * (1 + rnd() * 0.4)) * amp);
      }
      c.strokeStyle = g % 3 === 0 ? 'rgba(255,255,255,0.9)' : 'rgba(120,74,20,0.9)';
      c.lineWidth = 0.6 + rnd() * 1.6;
      c.stroke();
    }
    c.restore();

    // 边缘暗角
    var vignette = c.createRadialGradient(size / 2, size / 2, size * 0.32, size / 2, size / 2, size * 0.76);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(88,52,10,0.18)');
    c.fillStyle = vignette;
    c.fillRect(0, 0, size, size);

    // 网格
    c.strokeStyle = 'rgba(74,48,18,0.78)';
    c.lineWidth = Math.max(0.8, size / 620);
    c.beginPath();
    for (var i = 0; i < SIZE; i++) {
      c.moveTo(pos(i), pos(0));
      c.lineTo(pos(i), pos(SIZE - 1));
      c.moveTo(pos(0), pos(i));
      c.lineTo(pos(SIZE - 1), pos(i));
    }
    c.stroke();

    // 外框加粗
    c.lineWidth = Math.max(1.6, size / 320);
    c.strokeStyle = 'rgba(62,38,12,0.86)';
    c.strokeRect(pos(0), pos(0), pos(SIZE - 1) - pos(0), pos(SIZE - 1) - pos(0));

    // 星位
    c.fillStyle = 'rgba(58,36,12,0.88)';
    var starRadius = Math.max(2, cell * 0.075);
    STAR_POINTS.forEach(function (p) {
      c.beginPath();
      c.arc(pos(p[1]), pos(p[0]), starRadius, 0, Math.PI * 2);
      c.fill();
    });

    // 坐标
    if (state.showCoords) {
      c.fillStyle = 'rgba(70,44,16,0.7)';
      c.font = Math.max(9, cell * 0.34) + 'px "Segoe UI", system-ui, sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      for (var k = 0; k < SIZE; k++) {
        c.fillText(String.fromCharCode(65 + k), pos(k), inset * 0.5);
        c.fillText(String.fromCharCode(65 + k), pos(k), size - inset * 0.5);
        c.fillText(String(k + 1), inset * 0.5, pos(k));
        c.fillText(String(k + 1), size - inset * 0.5, pos(k));
      }
    }
  }

  /* ---------------- 绘制 ---------------- */

  function drawStone(r, c, player, options) {
    var opts = options || {};
    var x = pos(c);
    var y = pos(r);
    var radius = geometry.cell * 0.46;
    var c2 = ctx;

    if (opts.ghost) {
      c2.save();
      c2.globalAlpha = player === BLACK ? 0.3 : 0.45;
      c2.beginPath();
      c2.arc(x, y, radius, 0, Math.PI * 2);
      c2.fillStyle = player === BLACK ? '#2a2d34' : '#fbf8f1';
      c2.fill();
      c2.restore();
      return;
    }

    c2.save();
    c2.beginPath();
    c2.arc(x + radius * 0.08, y + radius * 0.18, radius * 1.02, 0, Math.PI * 2);
    c2.fillStyle = 'rgba(60,34,8,0.28)';
    c2.filter = 'blur(' + Math.max(1, radius * 0.14) + 'px)';
    c2.fill();
    c2.restore();

    var g = c2.createRadialGradient(
      x - radius * 0.35, y - radius * 0.4, radius * 0.1,
      x, y, radius * 1.12
    );
    if (player === BLACK) {
      g.addColorStop(0, '#6f7583');
      g.addColorStop(0.35, '#31353d');
      g.addColorStop(1, '#0b0c10');
    } else {
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.55, '#f6f2e9');
      g.addColorStop(1, '#cfc7b6');
    }

    c2.beginPath();
    c2.arc(x, y, radius, 0, Math.PI * 2);
    c2.fillStyle = g;
    c2.fill();
    c2.lineWidth = Math.max(0.7, radius * 0.055);
    c2.strokeStyle = player === BLACK ? 'rgba(255,255,255,0.14)' : 'rgba(120,105,80,0.5)';
    c2.stroke();

    // 高光
    c2.beginPath();
    c2.ellipse(x - radius * 0.3, y - radius * 0.36, radius * 0.3, radius * 0.2, -0.7, 0, Math.PI * 2);
    c2.fillStyle = player === BLACK ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';
    c2.fill();
  }

  function draw() {
    var size = geometry.size;
    var dpr = geometry.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bgCanvas, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 落子
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = Core.get(state.board, r, c);
        if (v !== EMPTY) drawStone(r, c, v);
      }
    }

    // 最后一手标记
    var last = state.history[state.history.length - 1];
    if (last && !state.over) {
      ctx.beginPath();
      ctx.arc(pos(last.c), pos(last.r), geometry.cell * 0.13, 0, Math.PI * 2);
      ctx.fillStyle = last.player === BLACK ? '#e8b45c' : '#c2410c';
      ctx.fill();
    }

    // 五连高亮
    if (state.winningLine) {
      var line = state.winningLine;
      var first = line[0];
      var lastP = line[line.length - 1];
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 205, 96, 0.95)';
      ctx.lineWidth = Math.max(3, geometry.cell * 0.12);
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(255, 196, 70, 0.85)';
      ctx.shadowBlur = geometry.cell * 0.5;
      ctx.beginPath();
      ctx.moveTo(pos(first[1]), pos(first[0]));
      ctx.lineTo(pos(lastP[1]), pos(lastP[0]));
      ctx.stroke();
      ctx.restore();

      line.forEach(function (p) {
        ctx.beginPath();
        ctx.arc(pos(p[1]), pos(p[0]), geometry.cell * 0.49, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 214, 120, 0.95)';
        ctx.lineWidth = Math.max(2, geometry.cell * 0.07);
        ctx.stroke();
      });
    }

    // 悬停预览
    if (state.hover && !state.over && !state.thinking && isHumanTurn() &&
        Core.get(state.board, state.hover.r, state.hover.c) === EMPTY) {
      drawStone(state.hover.r, state.hover.c, state.current, { ghost: true });
    }

    // 棋盘外发光边框
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, size - 1, size - 1);
  }

  /* ---------------- 音效 ---------------- */

  var audioCtx = null;
  function playSound(player) {
    if (!state.soundOn) return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'triangle';
      var base = player === BLACK ? 320 : 430;
      osc.frequency.setValueAtTime(base, t);
      osc.frequency.exponentialRampToValueAtTime(base * 0.55, t + 0.09);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.14, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.18);
    } catch (e) { /* 音效失败不影响对局 */ }
  }

  /* ---------------- 状态与 UI 同步 ---------------- */

  function isHumanTurn() {
    return state.mode === 'pvp' || state.current === state.humanColor;
  }

  function colorName(player) {
    return player === BLACK ? '黑棋' : '白棋';
  }

  function renderStatus() {
    var dotClass = state.current === BLACK ? 'black' : 'white';
    el.turnDot.className = 'turn-dot ' + dotClass + (state.over ? ' win' : '');

    if (state.over) {
      if (state.winner === 'draw') {
        el.statusText.textContent = '和棋';
        el.statusSub.textContent = '棋盘已满，本局平局';
      } else {
        el.statusText.textContent = colorName(state.winner) + '获胜';
        el.statusSub.textContent = '共 ' + state.history.length + ' 手，点击「重新开始」再来一盘';
      }
      return;
    }

    if (state.mode === 'pve') {
      var mine = state.current === state.humanColor;
      el.statusText.textContent = mine
        ? '轮到你了（' + colorName(state.current) + '）'
        : 'AI 回合（' + colorName(state.current) + '）';
      el.statusSub.textContent = mine ? '点击棋盘交叉点落子' : '正在计算最佳位置…';
    } else {
      el.statusText.textContent = colorName(state.current) + '回合';
      el.statusSub.textContent = '黑棋先行，轮流落子';
    }
  }

  function renderScores() {
    el.scoreBlack.textContent = state.scores.black;
    el.scoreWhite.textContent = state.scores.white;
    el.scoreDraw.textContent = state.scores.draw;
  }

  function renderHistory() {
    if (!state.history.length) {
      el.history.innerHTML = '<li class="empty">还没有落子记录</li>';
      return;
    }
    var html = '';
    for (var i = 0; i < state.history.length; i++) {
      var m = state.history[i];
      var latest = i === state.history.length - 1 ? ' class="latest"' : '';
      html += '<li' + latest + '><span class="no">' + (i + 1) + '</span>' +
        '<span class="dot ' + (m.player === BLACK ? 'black' : 'white') + '"></span>' +
        '<span>' + Core.toNotation(m.r, m.c) + '</span></li>';
    }
    el.history.innerHTML = html;
    el.history.scrollTop = el.history.scrollHeight;
  }

  function renderControls() {
    canvas.classList.toggle('locked',
      state.over || state.thinking || !isHumanTurn());
    el.undoBtn.disabled = state.thinking || state.history.length === 0;
    el.thinking.hidden = !state.thinking;
  }

  function render() {
    renderStatus();
    renderHistory();
    renderControls();
    renderScores();
    draw();
  }

  /* ---------------- 对局流程 ---------------- */

  function resetGame(options) {
    var opts = options || {};
    state.board = Core.createBoard();
    state.current = BLACK;
    state.history = [];
    state.over = false;
    state.winningLine = null;
    state.winner = null;
    state.thinking = false;
    state.hover = null;
    el.overlay.hidden = true;
    if (opts.resetScores) {
      state.scores = { black: 0, white: 0, draw: 0 };
    }
    render();
    maybeAiMove();
  }

  function place(r, c, player) {
    Core.set(state.board, r, c, player);
    state.history.push({ r: r, c: c, player: player });

    var win = Core.findWin(state.board, r, c);
    if (win) {
      state.over = true;
      state.winner = player;
      state.winningLine = win;
      if (player === BLACK) state.scores.black++;
      else state.scores.white++;
      showOverlay(colorName(player) + '获胜', '共 ' + state.history.length + ' 手 · ' +
        Core.toNotation(win[0][0], win[0][1]) + ' → ' + Core.toNotation(win[4][0], win[4][1]));
      playSound(player);
      render();
      return true;
    }

    if (Core.isFull(state.board)) {
      state.over = true;
      state.winner = 'draw';
      state.scores.draw++;
      showOverlay('和棋', '棋盘已满，双方均未连成五子');
      render();
      return true;
    }

    state.current = Core.other(player);
    playSound(player);
    render();
    return false;
  }

  function showOverlay(title, text) {
    el.overlayTitle.textContent = title;
    el.overlayText.textContent = text;
    el.overlay.hidden = false;
  }

  function maybeAiMove() {
    if (state.mode !== 'pve' || state.over) return;
    if (state.current === state.humanColor) return;

    state.thinking = true;
    render();

    // 让出主线程，先把「思考中」画出来
    window.setTimeout(function () {
      var move = Core.chooseMove(state.board, state.current, state.level);
      state.thinking = false;
      if (move && Core.get(state.board, move.r, move.c) === EMPTY) {
        place(move.r, move.c, state.current);
      } else {
        render();
      }
    }, 160);
  }

  function handleHumanMove(r, c) {
    if (state.over || state.thinking || !isHumanTurn()) return;
    if (Core.get(state.board, r, c) !== EMPTY) return;
    state.hover = null;
    var finished = place(r, c, state.current);
    if (!finished) maybeAiMove();
  }

  function undo() {
    if (state.thinking || !state.history.length) return;

    function popMove() {
      var m = state.history.pop();
      Core.set(state.board, m.r, m.c, EMPTY);
    }

    popMove();
    // 人机模式下继续回退，直到重新轮到人类落子
    if (state.mode === 'pve') {
      while (state.history.length) {
        var nextTurn = Core.other(state.history[state.history.length - 1].player);
        if (nextTurn === state.humanColor) break;
        popMove();
      }
    }

    state.over = false;
    state.winner = null;
    state.winningLine = null;
    state.current = state.history.length
      ? Core.other(state.history[state.history.length - 1].player)
      : BLACK;
    el.overlay.hidden = true;
    render();

    // 极端情况下（例如 AI 执黑开局）继续让 AI 走
    maybeAiMove();
  }

  /* ---------------- 事件绑定 ---------------- */

  canvas.addEventListener('mousemove', function (e) {
    var cellPos = clientToCell(e.clientX, e.clientY);
    var changed = (!!cellPos !== !!state.hover) ||
      (cellPos && state.hover && (cellPos.r !== state.hover.r || cellPos.c !== state.hover.c));
    if (changed) {
      state.hover = cellPos;
      draw();
    }
  });

  canvas.addEventListener('mouseleave', function () {
    if (state.hover) {
      state.hover = null;
      draw();
    }
  });

  canvas.addEventListener('click', function (e) {
    var cellPos = clientToCell(e.clientX, e.clientY);
    if (cellPos) handleHumanMove(cellPos.r, cellPos.c);
  });

  document.querySelectorAll('.seg').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.classList.contains('active')) return;
      document.querySelectorAll('.seg').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      el.aiOptions.classList.toggle('hidden', state.mode !== 'pve');
      resetGame({ resetScores: true });
    });
  });

  el.sideSelect.addEventListener('change', function () {
    state.humanColor = el.sideSelect.value === 'black' ? BLACK : WHITE;
    resetGame({ resetScores: true });
  });

  el.levelSelect.addEventListener('change', function () {
    state.level = el.levelSelect.value;
  });

  el.restartBtn.addEventListener('click', function () { resetGame({ resetScores: true }); });
  el.undoBtn.addEventListener('click', undo);
  el.overlayAgain.addEventListener('click', function () { resetGame({ resetScores: true }); });
  el.overlayClose.addEventListener('click', function () { el.overlay.hidden = true; });
  el.overlay.addEventListener('click', function (e) {
    if (e.target === el.overlay) el.overlay.hidden = true;
  });

  el.coordToggle.addEventListener('change', function () {
    state.showCoords = el.coordToggle.checked;
    computeGeometry();
    draw();
  });

  el.soundBtn.addEventListener('click', function () {
    state.soundOn = !state.soundOn;
    el.soundBtn.setAttribute('aria-pressed', String(state.soundOn));
    if (state.soundOn) playSound(BLACK);
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'u' || e.key === 'U') { undo(); }
    else if (e.key === 'r' || e.key === 'R') { resetGame({ resetScores: true }); }
    else if (e.code === 'Space') {
      e.preventDefault();
      el.soundBtn.click();
    } else if (e.key === 'Escape') {
      el.overlay.hidden = true;
    }
  });

  function handleResize() {
    var width = canvas.getBoundingClientRect().width;
    if (Math.abs(width - geometry.size) < 0.5) return;
    computeGeometry();
    draw();
  }

  if (window.ResizeObserver) {
    new ResizeObserver(handleResize).observe(canvas.parentElement);
  }
  window.addEventListener('resize', handleResize);

  /* ---------------- 启动 ---------------- */

  computeGeometry();
  render();
})();

</script>
</body>
</html>
